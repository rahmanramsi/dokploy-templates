services:
  database:
    image: mariadb:11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "db:/var/lib/mysql"
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${password:16}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  leconfe:
    image: leconfe/leconfe:1.3.0-beta.4
    restart: unless-stopped
    depends_on:
      - database
    environment:
      PHP_OPCACHE_ENABLE: 1
      PHP_POST_MAX_SIZE: "100M"
      PHP_UPLOAD_MAX_FILE_SIZE: "100M"

      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_INSTALLED: true
      APP_FORCE_HTTPS: false

      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}

      DB_CONNECTION: "mysql"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_USER_PASSWORD}

      MAIL_MAILER: "smtp"
      MAIL_HOST: "127.0.0.1"
      MAIL_PORT: "1025"
      # MAIL_USERNAME: null
      # MAIL_PASSWORD: null
      # MAIL_ENCRYPTION: null
      # MAIL_FROM_ADDRESS: "hello@example.com"

      MAX_FILE_UPLOAD_SIZE: 30 # MB
      ACCEPTED_FILE_TYPES: 'pdf,doc,docx,xls,xlsx,odt,txt,xml,jpg,jpeg,csv,png,webp,text/xml,ppt'
    volumes:
      - storage-app:/var/www/html/storage/app
      - plugins:/var/www/html/plugins
      - sessions:/var/www/html/storage/framework/sessions
      - logs:/var/www/html/storage/logs
volumes:
  db:
  storage-app:
  plugins:
  sessions:
  logs: